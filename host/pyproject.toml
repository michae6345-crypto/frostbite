[project]
name = "frostbite-host"
version = "0.1.0"
description = "Laptop side of the Frostbite macropad"
requires-python = ">=3.12"
dependencies = ["hidapi>=0.14"]

[project.scripts]
frostbite-daemon = "frostbite_host.daemon:main"
frostbite-hook = "frostbite_host.hook:main"
frostbite-ctl = "frostbite_host.ctl:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frostbite_host"]
